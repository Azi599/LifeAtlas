name: Native feature update
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Build service request ID
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle wrapper --gradle-version 8.9
      - name: Compile and unit test
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:assembleDebugAndroidTest -PatlasVersionCode=$((1000 + ${{ github.run_number }})) --stacktrace
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-native-update
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: app/build/reports/
  sign:
    runs-on: ubuntu-latest
    needs: verify
    environment: native-release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-native-update
          path: unsigned
      - name: Sign verified APK
        env:
          KEYSTORE: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ATLAS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ATLAS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" || { echo 'Configure native-release signing credentials'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/atlas.jks"
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          apk=$(find unsigned -name '*.apk' -type f | head -1)
          mkdir -p signed
          "$build_tools/zipalign" -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign --ks "$RUNNER_TEMP/atlas.jks" --ks-pass env:STORE_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out signed/LifeAtlas-update.apk "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify --print-certs signed/LifeAtlas-update.apk
          rm "$RUNNER_TEMP/atlas.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-native-update
          path: signed/LifeAtlas-update.apk
          if-no-files-found: error
