name: Life Atlas language acceptance
on:
  push:
    branches: [test/language-acceptance]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lifeatlas-language-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: qwen25-3b
            url: https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf
            sha256: 626b4a6678b86442240e33df819e00132d3ba7dddfe1cdc4fbb18e0a9615c62d
            cases: project,weight-yesterday,weight-paraphrase,mixed,midnight,ambiguous-edit,appearance
          - model: qwen3-4b
            url: https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/76dc22206b646ece7c569161a42fdd4ae1bdbfcc/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
            sha256: 3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597
            cases: weight-yesterday,mixed,edit-history,midnight,ambiguous-edit,report,new-feature,navigation,image-receipt
    env:
      ATLAS_ACCEPTANCE_CASES: ${{ matrix.cases }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-31
          key: android-system-image-Linux-31-google-apis-x86_64-v1
      - uses: actions/cache/restore@v4
        id: model-cache
        with:
          path: ${{ runner.temp }}/lifeatlas-acceptance/qwen.gguf
          key: lifeatlas-model-${{ matrix.sha256 }}
      - name: Download and verify the actual test model and engine
        env:
          ATLAS_MODEL_URL: ${{ matrix.url }}
          ATLAS_MODEL_SHA256: ${{ matrix.sha256 }}
        run: |
          model_dir="$RUNNER_TEMP/lifeatlas-acceptance"
          mkdir -p "$model_dir/bin"
          if [ ! -f "$model_dir/qwen.gguf" ]; then
            curl -fsSL --retry 3 --max-time 600 "$ATLAS_MODEL_URL" -o "$model_dir/qwen.gguf"
          fi
          printf '%s  %s\n' "$ATLAS_MODEL_SHA256" "$model_dir/qwen.gguf" | sha256sum -c -
          curl -fsSL --retry 3 'https://github.com/ggml-org/llama.cpp/releases/download/b11695/llama-b11695-bin-ubuntu-x64.tar.gz' -o "$model_dir/engine.tar.gz"
          printf '7e77d0c9f498265803b2861f5ddf3ecdda5112dfd9ece6e4558e1d495b4ab1a3  %s\n' "$model_dir/engine.tar.gz" | sha256sum -c -
          tar -xzf "$model_dir/engine.tar.gz" -C "$model_dir/bin" --strip-components=1
          test -x "$model_dir/bin/llama-server"
      - uses: actions/cache/save@v4
        if: steps.model-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/lifeatlas-acceptance/qwen.gguf
          key: lifeatlas-model-${{ matrix.sha256 }}
      - run: bash scripts/verify_wrapper.sh
      - run: bash scripts/prepare_emulator.sh 31
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          disable-animations: true
          script: bash scripts/acceptance/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: language-acceptance-${{ matrix.model }}
          path: |
            acceptance/
            app/build/outputs/androidTest-results/
            app/build/test-results/testStandaloneDebugUnitTest/
