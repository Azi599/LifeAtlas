name: Android build
on:
  push:
    branches: [main, build/verify-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Verify checked-in Wrapper
        run: bash scripts/verify_wrapper.sh
      - name: Test build service
        run: python3 -m unittest discover -s server/build_orchestrator -v
      - name: Build and unit test
        run: ./gradlew :app:lintStandaloneDebug :app:testStandaloneDebugUnitTest :app:assembleStandaloneDebug :app:assembleStandaloneDebugAndroidTest :app:bundlePlayRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lifeatlas-development-build
          path: |
            app/build/outputs/apk/standalone/debug/*.apk
            app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error

  android-tests:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35, 36]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ matrix.api }}
          key: android-system-image-${{ runner.os }}-${{ matrix.api }}-google-apis-x86_64-v1
      - name: Prepare emulator SDK
        run: bash scripts/prepare_emulator.sh "${{ matrix.api }}"
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
      - run: bash scripts/verify_wrapper.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          disable-animations: false
          script: bash scripts/android_verify.sh "${{ matrix.api }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification-${{ matrix.api }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            screenshots/
